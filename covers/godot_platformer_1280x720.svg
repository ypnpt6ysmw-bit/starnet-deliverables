<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C7BE"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>

    <!-- Glass Specular Gradient -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="180" r="260" fill="#00C7BE" opacity="0.09" filter="url(#cyanGlow)"/>
  <circle cx="1060" cy="540" r="320" fill="#0A84FF" opacity="0.08" filter="url(#cyanGlow)"/>

  <!-- Main Glass Container Card -->
  <rect x="80" y="80" width="1120" height="560" rx="28" fill="rgba(20, 24, 33, 0.72)" stroke="url(#glassRim)" stroke-width="1.2"/>

  <!-- Top Category Pill -->
  <g transform="translate(140, 140)">
    <rect width="210" height="38" rx="19" fill="rgba(0, 199, 190, 0.12)" stroke="rgba(0, 199, 190, 0.35)" stroke-width="1"/>
    <text x="105" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" fill="#00C7BE" letter-spacing="0.08em" text-anchor="middle">GODOT 4.3 • GDSCRIPT</text>
  </g>

  <!-- 60 FPS Certified Pill -->
  <g transform="translate(365, 140)">
    <rect width="180" height="38" rx="19" fill="rgba(48, 209, 88, 0.12)" stroke="rgba(48, 209, 88, 0.35)" stroke-width="1"/>
    <text x="90" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" fill="#30D158" letter-spacing="0.08em" text-anchor="middle">60 FPS CERTIFIED</text>
  </g>

  <!-- Hero Typography -->
  <text x="140" y="245" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-0.025em">
    Retro Sci-Fi Platformer
  </text>
  <text x="140" y="315" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="52" font-weight="800" fill="url(#cyanGrad)" letter-spacing="-0.025em">
    Controller &amp; Kinematics
  </text>

  <!-- Subheadline -->
  <text x="140" y="375" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="20" font-weight="400" fill="rgba(235, 235, 245, 0.75)" letter-spacing="-0.01em">
    Complete CharacterBody2D state machine with coyote time, jump buffering, and air dash.
  </text>

  <!-- Feature Metric Pills (Horizontal Row) -->
  <g transform="translate(140, 425)">
    <!-- Pill 1: Coyote Time -->
    <rect x="0" y="0" width="210" height="72" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="rgba(235, 235, 245, 0.50)">COYOTE TIME</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">0.12s Window</text>

    <!-- Pill 2: Jump Buffer -->
    <rect x="230" y="0" width="210" height="72" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="254" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="rgba(235, 235, 245, 0.50)">JUMP BUFFER</text>
    <text x="254" y="56" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">0.10s Window</text>

    <!-- Pill 3: Dash Speed -->
    <rect x="460" y="0" width="210" height="72" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="484" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="rgba(235, 235, 245, 0.50)">AIR DASH</text>
    <text x="484" y="56" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700" fill="#00C7BE">720 px/sec</text>
  </g>

  <!-- Price & License Footer -->
  <g transform="translate(140, 560)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">16 zł <tspan font-size="20" font-weight="400" fill="rgba(235, 235, 245, 0.5)">/ $16</tspan></text>
    <text x="145" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" text-decoration="line-through" fill="rgba(235, 235, 245, 0.35)">$45 Competitor</text>
    <text x="280" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="700" fill="#30D158">SAVE 64% • LIFETIME COMMERCIAL LICENSE</text>
  </g>

  <!-- Right Visual Preview: Interactive Platformer State Graphic -->
  <g transform="translate(860, 220)">
    <!-- Outer Stage Squircles -->
    <rect x="0" y="0" width="280" height="340" rx="20" fill="rgba(12, 16, 24, 0.85)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>

    <!-- Simulated Godot Level -->
    <!-- Floor -->
    <rect x="24" y="280" width="232" height="16" rx="4" fill="rgba(255, 255, 255, 0.15)"/>
    <!-- Floating Platform -->
    <rect x="40" y="190" width="90" height="12" rx="4" fill="#00C7BE" opacity="0.6"/>
    <!-- Floating Platform 2 -->
    <rect x="150" y="130" width="90" height="12" rx="4" fill="#0A84FF" opacity="0.6"/>

    <!-- Player Capsule -->
    <rect x="70" y="145" width="28" height="45" rx="14" fill="#00C7BE" filter="url(#cyanGlow)"/>
    <rect x="70" y="145" width="28" height="45" rx="14" fill="#00C7BE"/>

    <!-- Jump Trajectory Arc -->
    <path d="M 84 145 Q 110 80, 195 130" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Code Pill -->
    <rect x="24" y="24" width="232" height="40" rx="8" fill="rgba(0, 0, 0, 0.5)"/>
    <text x="36" y="48" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#00C7BE">extends CharacterBody2D</text>
  </g>
</svg>
